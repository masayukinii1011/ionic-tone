<ion-content scroll-y="false" (window:resize)="onResize()">
  <div class="content-inner">

    <div class="start-overlay" *ngIf="showStartOverlay">
      <p>Tap a pad to start</p>
    </div>

    <div class="pad-area" [style.height.px]="padAreaHeight" [style.width.px]="padAreaWidth">
      <ion-grid>
        <ion-row *ngFor="let notes of notesArray">
          <ion-col
            class="ion-activatable pad-col"
            *ngFor="let note of notes"
            (touchstart)="noteOn(note, $event)"
            (touchend)="noteOff(note, $event)"
            (touchcancel)="noteOff(note, $event)"
            (mousedown)="noteOn(note, $event)"
            (mouseup)="noteOff(note, $event)"
            (mouseleave)="noteOff(note, $event)"
          >
            <ion-ripple-effect></ion-ripple-effect>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

    <div class="effect-area" [style.height.px]="effectAreaHeight" [style.width.px]="effectAreaWidth">
      <p class="synth-info">Polyphony: {{ maxPolyphony }}</p>
      <ion-list class="ion-no-padding">

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">Filter</ion-label>
          <ion-range class="ion-no-padding" min="40" max="400" [ngModel]="autoWahBaseFrequency" (ionChange)="onAutoWahChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">40</ion-label>
            <ion-label class="effect-value" slot="end">400</ion-label>
          </ion-range>
        </ion-item>

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">Vibrato</ion-label>
          <ion-range class="ion-no-padding" min="0" max="10" step="0.1" [ngModel]="vibratoFrequency" (ionChange)="onVibratoChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">0</ion-label>
            <ion-label class="effect-value" slot="end">10</ion-label>
          </ion-range>
        </ion-item>

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">Chorus</ion-label>
          <ion-range class="ion-no-padding" min="0" max="1" step="0.1" [ngModel]="chorusFrequency" (ionChange)="onChorusChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">0</ion-label>
            <ion-label class="effect-value" slot="end">1</ion-label>
          </ion-range>
        </ion-item>

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">DelayTime</ion-label>
          <ion-range class="ion-no-padding" min="0" max="1" step="0.1" [ngModel]="delayTime" (ionChange)="onDelayTimeChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">0</ion-label>
            <ion-label class="effect-value" slot="end">1</ion-label>
          </ion-range>
        </ion-item>

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">DelayFeedback</ion-label>
          <ion-range class="ion-no-padding" min="0" max="1" step="0.01" [ngModel]="delayFeedback" (ionChange)="onDelayFeedbackChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">0</ion-label>
            <ion-label class="effect-value" slot="end">1</ion-label>
          </ion-range>
        </ion-item>

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">ReverbRoomSize</ion-label>
          <ion-range class="ion-no-padding" min="0" max="0.9" step="0.01" [ngModel]="reverbRoomSize" (ionChange)="onReverbRoomSizeChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">0</ion-label>
            <ion-label class="effect-value" slot="end">1</ion-label>
          </ion-range>
        </ion-item>

        <ion-item class="ion-no-padding">
          <ion-label class="effect-name">ReverbWet</ion-label>
          <ion-range class="ion-no-padding" min="0" max="100" [ngModel]="reverbWet" (ionChange)="onReverbWetChange($event.detail.value)">
            <ion-label class="effect-value" slot="start">0</ion-label>
            <ion-label class="effect-value" slot="end">100</ion-label>
          </ion-range>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
